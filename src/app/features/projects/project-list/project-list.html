<div class="project-list">

  <div class="page-header">
    <div>
      <h1 class="page-title">Projets</h1>
      <p class="page-sub">{{ total }} projet(s) enregistré(s)</p>
    </div>
    <a class="btn-primary" routerLink="/projects/new">
      <mat-icon>add</mat-icon> Nouveau projet
    </a>
  </div>

  <!-- Filtres -->
  <div class="filters">
    <div class="search-wrap">
      <mat-icon class="search-icon">search</mat-icon>
      <input class="search-input" [(ngModel)]="search" placeholder="Titre, technologie...">
      <button class="clear-btn" *ngIf="search" (click)="search=''"><mat-icon>close</mat-icon></button>
    </div>
    <div class="statut-pills">
      <button *ngFor="let s of statutOptions"
              class="pill" [class.pill--active]="filterStatut === s.value"
              (click)="filterStatut = s.value"
              [style.--pill-color]="s.color">
        {{ s.label }}
      </button>
    </div>
  </div>

  <!-- Skeleton -->
  <div class="cards-grid" *ngIf="loading">
    <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <!-- Grid -->
  <div class="cards-grid" *ngIf="!loading">
    <div class="project-card" *ngFor="let p of filtered">
      <div class="project-card__top">
        <div class="project-card__icon"><mat-icon>folder_special</mat-icon></div>
        <div class="status-badge" [class]="css(p.statut)">
          <div class="dot" [style.background]="dot(p.statut)"></div>
          {{ label(p.statut) }}
        </div>
      </div>
      <h3 class="project-card__title">{{ p.titre }}</h3>
      <p class="project-card__desc">{{ p.description }}</p>
      <div class="project-card__tech">
        <span class="tech-tag" *ngFor="let t of techs(p.technologies)">{{ t }}</span>
      </div>
      <div class="project-card__footer">
        <div class="encadrant-info" *ngIf="p.encadrant">
          <div class="mini-avatar">{{ p.encadrant.nom.charAt(0) }}</div>
          <span>{{ p.encadrant.nom }}</span>
        </div>
        <div class="card-actions">
          <a [routerLink]="['/projects', p.id]" class="action-btn action-btn--view" matTooltip="Détails">
            <mat-icon>visibility</mat-icon>
          </a>
          <button class="action-btn action-btn--delete" matTooltip="Supprimer" (click)="delete(p)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Empty -->
    <div class="empty-state" *ngIf="filtered.length === 0">
      <mat-icon>folder_off</mat-icon>
      <span>Aucun projet trouvé</span>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination" *ngIf="!loading && totalPages > 1">
    <button class="page-btn" [disabled]="page === 0" (click)="prevPage()"><mat-icon>chevron_left</mat-icon></button>
    <span class="page-info">Page {{ page+1 }} / {{ totalPages }}</span>
    <button class="page-btn" [disabled]="page >= totalPages-1" (click)="nextPage()"><mat-icon>chevron_right</mat-icon></button>
  </div>
</div>
