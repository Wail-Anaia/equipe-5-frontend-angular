<div class="documents-page">

  <div class="page-header">
    <div>
      <h1 class="page-title">Mes documents</h1>
      <p class="page-sub">{{ documents.length }} document(s) associé(s) à vos projets</p>
    </div>
    <button class="btn-upload">
      <mat-icon>upload_file</mat-icon>
      Déposer un document
    </button>
  </div>

  <!-- Skeleton -->
  <div class="skeleton-grid" *ngIf="loading">
    <div class="skeleton-card" *ngFor="let i of [1,2,3,4]"></div>
  </div>

  <!-- Grid -->
  <div class="doc-grid" *ngIf="!loading">

    <div class="doc-card" *ngFor="let doc of documents">
      <div class="doc-card__top">
        <div class="doc-icon"
             [style.background]="getDocColor(doc.type) + '15'"
             [style.border-color]="getDocColor(doc.type) + '30'">
          <mat-icon [style.color]="getDocColor(doc.type)">{{ getDocIcon(doc.type) }}</mat-icon>
        </div>
        <span class="doc-type" [style.color]="getDocColor(doc.type)"
              [style.background]="getDocColor(doc.type) + '12'">{{ doc.type }}</span>
      </div>

      <div class="doc-card__body">
        <span class="doc-name">{{ doc.nom }}</span>
        <span class="doc-project" *ngIf="doc.projetTitre">
          <mat-icon>folder</mat-icon>{{ doc.projetTitre }}
        </span>
      </div>

      <div class="doc-card__footer">
        <div class="doc-meta">
          <span *ngIf="doc.taille">{{ doc.taille }}</span>
          <span class="meta-sep" *ngIf="doc.taille">·</span>
          <span>{{ doc.uploadedAt | date:'dd/MM/yyyy' }}</span>
        </div>
        <button class="btn-download" (click)="download(doc)">
          <mat-icon>download</mat-icon>
        </button>
      </div>
    </div>

    <!-- Empty -->
    <div class="empty-state" *ngIf="documents.length === 0">
      <mat-icon>folder_open</mat-icon>
      <span>Aucun document trouvé</span>
    </div>

  </div>
</div>
