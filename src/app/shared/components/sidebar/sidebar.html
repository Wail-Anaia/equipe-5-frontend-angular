<aside class="sidebar" [class.sidebar--collapsed]="collapsed">

  <!-- Logo & Brand -->
  <div class="sidebar__brand">
    <div class="sidebar__logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,4 36,14 36,26 20,36 4,26 4,14" fill="#6C63FF" opacity="0.15" stroke="#6C63FF" stroke-width="1.5"/>
        <polygon points="20,9 31,16 31,24 20,31 9,24 9,16" fill="#6C63FF" opacity="0.3" stroke="#6C63FF" stroke-width="1"/>
        <circle cx="20" cy="20" r="5" fill="#6C63FF"/>
      </svg>
    </div>
    <div class="sidebar__brand-text" *ngIf="!collapsed">
      <span class="sidebar__brand-name">UniPFE</span>
      <span class="sidebar__brand-sub">Plateforme académique</span>
    </div>
    <button class="sidebar__collapse-btn" (click)="collapseToggle.emit()" matRipple>
      <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <!-- User profile pill -->
  <div class="sidebar__user" *ngIf="!collapsed">
    <div class="sidebar__avatar">
      <span>{{ auth.userName().charAt(0).toUpperCase() }}</span>
    </div>
    <div class="sidebar__user-info">
      <span class="sidebar__user-name">{{ auth.userName() }}</span>
      <span class="sidebar__role-badge" [class]="getRoleBadgeClass()">
        {{ getRoleLabel() }}
      </span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    <div class="sidebar__nav-label" *ngIf="!collapsed">Navigation</div>

    <ng-container *ngFor="let item of visibleItems()">

      <!-- Item sans enfants -->
      <ng-container *ngIf="!item.children || item.children.length === 0">
        <a class="sidebar__nav-item"
           [routerLink]="item.route"
           routerLinkActive="sidebar__nav-item--active"
           matRipple
           [matTooltip]="collapsed ? item.label : ''"
           matTooltipPosition="right">
          <mat-icon class="sidebar__nav-icon">{{ item.icon }}</mat-icon>
          <span class="sidebar__nav-label-text" *ngIf="!collapsed">{{ item.label }}</span>
        </a>
      </ng-container>

      <!-- Item avec sous-menu (accordion) -->
      <ng-container *ngIf="item.children && item.children.length > 0">
        <div class="sidebar__nav-item sidebar__nav-item--parent"
             (click)="toggleExpand(item.route)"
             matRipple
             [matTooltip]="collapsed ? item.label : ''"
             matTooltipPosition="right">
          <mat-icon class="sidebar__nav-icon">{{ item.icon }}</mat-icon>
          <span class="sidebar__nav-label-text" *ngIf="!collapsed">{{ item.label }}</span>
          <mat-icon class="sidebar__chevron" *ngIf="!collapsed">
            {{ isExpanded(item.route) ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </div>

        <div class="sidebar__submenu" [class.sidebar__submenu--open]="isExpanded(item.route)">
          <a *ngFor="let child of item.children"
             class="sidebar__nav-item sidebar__nav-item--child"
             [routerLink]="child.route"
             routerLinkActive="sidebar__nav-item--active"
             matRipple>
            <mat-icon class="sidebar__nav-icon sidebar__nav-icon--sm">{{ child.icon }}</mat-icon>
            <span class="sidebar__nav-label-text" *ngIf="!collapsed">{{ child.label }}</span>
          </a>
        </div>
      </ng-container>

    </ng-container>
  </nav>

  <!-- Bottom: logout -->
  <div class="sidebar__footer">
    <button class="sidebar__logout" (click)="auth.logout()" matRipple>
      <mat-icon>logout</mat-icon>
      <span *ngIf="!collapsed">Déconnexion</span>
    </button>
  </div>

</aside>
